<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1190" viewBox="0 0 2200 1190" role="img" aria-labelledby="title desc">
  <title id="title">Application Architecture：Service、Biz 与 CQRS</title>
  <desc id="desc">入口可以是 API handler、task 触发或 MQ message handler。Query Service 直接访问基础设施；Command Service 可以直接处理用例，也可委托 Biz。Service 和 Biz 可以基于复用、避免膨胀等因素进一步内部分层，并按职责操作基础设施。Repository interface 体现 Biz 对数据资源的需求，封装分页、缓存、跨表与 DAO 组合等细节。DAO 承接 Service、Biz 的数据库操作需求，提供与自身表相关的可复用 CRUD 方法，不预设调用方。独立 Domain 按需提取；虚线框不构成必经层级。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1 L 10 6 L 2 11" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #202124; font-size: 28px; }
      .box { fill: #eef2f8; stroke: #171717; stroke-width: 3.5; }
      .optional { stroke-dasharray: 8 8; }
      .flow { fill: none; stroke: #171717; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .label { font-size: 31px; text-anchor: middle; }
      .note { font-size: 28px; }
      .footer { font-size: 24px; fill: #555; }
    </style>
  </defs>
  <rect width="2200" height="1190" fill="white"/>
  <text x="570" y="76">入口，可能是 api handler，task 触发，mq message handler</text>
  <rect class="box" x="50" y="115" width="1710" height="155" rx="14"/>
  <text class="label" x="905" y="208">controller</text>

  <path class="flow" d="M 187 282 V 332"/>
  <rect class="box" x="70" y="345" width="235" height="125" rx="14" style="fill:#dff3e7"/>
  <text class="label" x="187" y="420">query service</text>
  <path class="flow" d="M 187 482 V 758"/>

  <path class="flow" d="M 927 282 V 320"/>
  <rect class="box" x="800" y="333" width="255" height="310" rx="14" style="fill:#fbe4e4"/>
  <text class="label" x="927" y="420" style="font-size:28px">command service</text>
  <text x="812" y="500">biz = load(xx)</text>
  <text x="812" y="542">biz.func</text>
  <text x="812" y="584">save(change)</text>
  <path class="flow" d="M 927 655 V 758"/>

  <text class="note" x="355" y="395" style="font-size:27px">
    <tspan x="355" dy="0">service 和 biz 基于复用、避免膨胀</tspan>
    <tspan x="355" dy="40">等因素也可能会内部分层</tspan>
  </text>
  <path class="flow" d="M 788 488 H 650 Q 627 488 627 510 V 528"/>
  <rect class="box optional" x="510" y="540" width="235" height="105" rx="12"/>
  <text class="label" x="627" y="604">service</text>
  <path class="flow" d="M 627 657 V 758"/>

  <text class="note" x="1085" y="325">
    <tspan x="1085" dy="0">如有必要，service 可以把逻辑委托为 biz，</tspan>
    <tspan x="1085" dy="40">biz 为了干活儿也可以操作 infra</tspan>
  </text>
  <path class="flow" d="M 1067 443 H 1173"/>
  <rect class="box" x="1185" y="415" width="235" height="60" rx="13"/>
  <text class="label" x="1302" y="457">biz</text>
  <rect class="box optional" x="1320" y="460" width="235" height="60" rx="13"/>
  <text class="label" x="1437" y="502">biz</text>
  <path class="flow" d="M 1437 532 V 583"/>
  <rect class="box optional" x="1320" y="595" width="235" height="80" rx="12"/>
  <text class="label" x="1437" y="646">repository</text>

  <rect class="box optional" x="1610" y="460" width="235" height="155" rx="78" style="fill:#eae3fa"/>
  <text class="label" x="1727" y="550">domain</text>
  <path class="flow" d="M 1437 687 V 705 Q 1437 725 1417 725 H 1090 Q 1070 725 1070 745 V 758"/>
  <text class="note" x="1435" y="742" style="font-size:26px">
    <tspan x="1435" dy="0">Repository interface 体现了 biz 对数据资源的需求</tspan>
    <tspan x="1435" dy="40">让 biz 核心逻辑可以不必关心分页、缓存、跨表 / dao 等细节</tspan>
  </text>

  <rect class="box" x="70" y="770" width="1285" height="205" rx="14"/>
  <rect class="box" x="180" y="795" width="235" height="155" rx="14"/>
  <text class="label" x="297" y="887">dao</text>
  <rect class="box" x="470" y="795" width="235" height="155" rx="14"/>
  <text class="label" x="587" y="887">dao</text>
  <rect class="box" x="1105" y="795" width="235" height="155" rx="14"/>
  <text class="label" x="1222" y="887">xxclient</text>
  <text x="1385" y="910">infra</text>

  <text class="note" x="530" y="1040">
    <tspan x="530" dy="0">dao 承接了 service、biz 的 db 操作需求，一个 dao 提供与自己对应的表有关的很多 crud 方法</tspan>
    <tspan x="530" dy="40">但是不预期提供的方法由谁（service 或 biz）来调用。</tspan>
    <tspan x="530" dy="40">也就是某个逻辑过于 service / biz specific 时，不适合放在 dao 里。</tspan>
  </text>
  <text class="footer" x="70" y="1170">CQRS 按用例区分 Command / Query；虚线表示按需提取，不要求经过所有组件。</text>
</svg>
