<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" role="img" aria-labelledby="title desc">
  <title id="title">Application Architecture：CQRS 与按需形成的业务边界</title>
  <desc id="desc">入口按用例目的区分 Command 与 Query。Query Service 通过 DAO 或 client 组织展示查询和投影。Command Service 组织业务操作，可直接访问基础设施，也可按需委托 Biz、独立 Domain 或 Repository。Command 所需的读取仍属于命令用例。Biz 封装内聚业务能力；Domain 承接独立领域模型与行为；Repository 为 Command 组织对象加载和保存。虚线框为可选组件，不构成必须经过的层级。两侧可共用 Service、数据库和 DAO。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 1 L 10 6 L 2 11" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #18212f; font-size: 25px; }
      .heading { font-size: 31px; font-weight: 600; }
      .label { font-size: 29px; font-weight: 600; text-anchor: middle; }
      .body { text-anchor: middle; }
      .note { font-size: 23px; fill: #475569; }
      .box { fill: white; stroke: #334155; stroke-width: 2.5; }
      .optional { stroke-dasharray: 8 7; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1250" fill="white"/>
  <text x="80" y="65" style="font-size:38px;font-weight:600">Application Architecture · CQRS</text>
  <text x="80" y="110">简单用例保持直接，复杂业务按职责、规则和变化形成边界</text>

  <rect x="80" y="150" width="1440" height="100" rx="14" fill="#eef2f8" stroke="#334155" stroke-width="2.5"/>
  <text class="label" x="800" y="192">入口：Controller / Task / MQ</text>
  <text class="body note" x="800" y="228">承接协议与触发上下文，选择用例</text>

  <rect x="80" y="310" width="420" height="610" rx="16" fill="#eef7fb" stroke="#c2dbe6" stroke-width="2"/>
  <rect x="540" y="310" width="980" height="610" rx="16" fill="#f4f1fa" stroke="#d9d0e8" stroke-width="2"/>
  <text class="heading" x="110" y="355">Query · 读取与展示</text>
  <text class="heading" x="580" y="355">Command · 业务操作（含所需读取）</text>
  <path class="flow" d="M 100 250 V 375 H 290 V 395"/>
  <path class="flow" d="M 560 250 V 375 H 765 V 395"/>

  <rect class="box" x="120" y="395" width="340" height="260" rx="14"/>
  <text class="label" x="290" y="447">Query Service</text>
  <text class="body" x="290" y="500">组织查询与结果</text>
  <text class="body" x="290" y="545">筛选 / 分页 / 排序</text>
  <text class="body" x="290" y="585">关联 / 字段投影</text>
  <text class="body" x="290" y="625">View Model / DTO</text>
  <path class="flow" d="M 290 655 V 1000"/>

  <rect class="box" x="590" y="395" width="350" height="190" rx="14"/>
  <text class="label" x="765" y="447">Command Service</text>
  <text class="body" x="765" y="497">组织用例与协调结果</text>
  <text class="body note" x="765" y="540">加载 → 执行规则 → 保存</text>
  <path class="flow" d="M 940 460 H 1040"/>
  <rect class="box optional" x="1040" y="395" width="420" height="145" rx="14"/>
  <text class="label" x="1250" y="450">Biz</text>
  <text class="body" x="1250" y="500">内聚的业务能力与规则</text>

  <path class="flow" d="M 1250 540 V 610"/>
  <rect class="box optional" x="1040" y="610" width="420" height="125" rx="14"/>
  <text class="label" x="1250" y="660">Domain</text>
  <text class="body" x="1250" y="703">独立的领域模型与行为</text>
  <text class="body note" x="1250" y="785">按需由 Service / Biz 调用</text>

  <path class="flow" d="M 765 585 V 745"/>
  <path class="flow" d="M 1040 505 H 990 V 805 H 940"/>
  <rect class="box optional" x="590" y="745" width="350" height="125" rx="14"/>
  <text class="label" x="765" y="795">Repository</text>
  <text class="body" x="765" y="838">Command 的对象加载与保存</text>
  <path class="flow" d="M 765 870 V 1000"/>
  <path class="flow" d="M 590 535 H 560 V 1000"/>
  <path class="flow" d="M 1460 460 H 1490 V 1000"/>
  <text class="note" x="855" y="960">Service / Biz 均可按职责直接访问基础设施</text>

  <rect x="80" y="1000" width="1440" height="125" rx="14" fill="#eef2f8" stroke="#334155" stroke-width="2.5"/>
  <text class="label" x="800" y="1050">DAO / Client · 基础设施</text>
  <text class="body" x="800" y="1095">条件查询、分页与聚合、持久化、外部访问</text>
  <text class="note" x="80" y="1175">CQRS 区分用例职责；两侧可共用 Service、数据库和 DAO。</text>
  <text class="note" x="80" y="1215">箭头表示可能的调用；虚线框按需提取，Biz、Domain、Repository 不构成必经层级。</text>
</svg>
